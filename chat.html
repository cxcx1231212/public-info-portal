<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>心水交流－123六合网</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090909;color:#ddd6ca;font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.chat-page{background:#090909;width:min(100%,440px);height:100dvh;margin:auto;box-shadow:0 0 70px #000000e6}.chat-panel{background:#090909;grid-template-rows:auto auto minmax(120px,1fr) auto auto auto;width:100%;height:100dvh;display:grid;overflow:hidden}.chat-panel>header{background:linear-gradient(135deg,#211a0e,#0b0b0a);border-bottom:1px solid #392f20;justify-content:space-between;align-items:center;padding:max(13px,env(safe-area-inset-top)) 15px 13px;min-height:68px;display:flex}.chat-panel>header strong{color:#e8ce83;font-size:17px;display:block}.chat-panel>header small{color:#81796c;margin-top:3px;font-size:11px;display:block}.chat-panel>header small i{background:#48ba77;border-radius:50%;width:6px;height:6px;margin-right:3px;display:inline-block}.chat-back{color:#d8bd78;text-decoration:none;white-space:nowrap;border:1px solid #66532e;border-radius:99px;padding:9px 11px;font-size:12px}.chat-draw{background:#15120d;border-bottom:1px solid #332d23;align-items:center;gap:10px;padding:11px 13px;display:flex}.chat-draw b{color:#090806;background:#9d782f;border-radius:5px;flex:none;padding:5px 8px;font-size:11px;letter-spacing:.04em}.chat-draw span{color:#c7b377;white-space:nowrap;text-overflow:ellipsis;font-size:13px;font-weight:600;letter-spacing:.02em;overflow:hidden}.chat-list{overscroll-behavior:contain;padding:14px 12px;overflow-y:auto}.chat-list article{max-width:86%;margin-bottom:10px}.chat-list article.mine{margin-left:auto}.chat-list article>div{align-items:center;gap:6px;margin-bottom:3px;display:flex}.chat-list article.mine>div{justify-content:flex-end}.chat-list article b{color:#af9a65;font-size:12px}.chat-list article time{color:#5e5951;font-size:10px}.chat-list article p{color:#ddd6ca;word-break:break-word;background:#151515;border:1px solid #353028;border-radius:3px 11px 11px;margin:0;padding:10px 12px;font-size:15px;line-height:1.45;display:inline-block}.chat-list article.mine p{color:#eed797;background:#2b2111;border-color:#77602f;border-radius:11px 3px 11px 11px;display:block}.chat-list article.admin-message-item{max-width:92%}.chat-list article.admin-message-item>div{justify-content:flex-start}.chat-list article.admin-message-item>div b{color:#f0d486}.chat-list article.admin-message-item p{color:#f3dfaa;background:linear-gradient(135deg,#35290f,#17120a);border-color:#b99345;border-radius:8px;display:block;box-shadow:inset 0 0 18px #ddb75714}.admin-chat-badge{color:#090806;background:#cba655;border:1px solid #d3ad55;border-radius:99px;padding:2px 5px;font-size:8px;font-style:normal;font-weight:800;line-height:1}.chat-empty{color:#665f55;place-items:center;min-height:150px;font-size:10px;display:grid}.chat-identity{background:#0d0d0d;border-top:1px solid #2f2b25;align-items:center;gap:8px;padding:7px 12px;display:flex}.chat-identity span{color:#746d62;font-size:12px}.chat-identity input{color:#cbb77e;background:#111;border:1px solid #493e2c;border-radius:99px;outline:none;width:145px;height:27px;padding:0 8px;font-size:10px}.chat-compose{grid-template-columns:1fr 62px;gap:7px;padding:10px 12px 5px;display:grid}.chat-compose input{color:#eee5d7;background:#111;border:1px solid #4b4234;border-radius:8px;outline:none;height:45px;padding:0 11px;font-size:11px}.chat-compose input:focus{border-color:#cba655}.chat-compose button{color:#080705;background:linear-gradient(135deg,#d6af59,#9e752b);border:1px solid #d5b35e;border-radius:8px;font-size:13px;font-weight:700}.chat-compose button:disabled{opacity:.4}.chat-quick{gap:5px;padding:0 12px;display:flex;overflow-x:auto;scrollbar-width:none}.chat-quick::-webkit-scrollbar{display:none}.chat-quick button{color:#8f8677;background:#0d0d0d;border:1px solid #40382b;border-radius:99px;flex:none;height:26px;padding:0 8px;font-size:10px}.chat-notice{color:#625c53;text-align:center;min-height:24px;margin:0;padding:6px 12px max(10px,env(safe-area-inset-bottom));font-size:10px}
</style></head><body><main class="chat-page"><section class="chat-panel"><header><div><strong>心水交流</strong><small><i></i><span id="online">1</span> 人在线 · 无需登录</small></div><a class="chat-back" href="index.html">‹ 返回首页</a></header><div class="chat-draw"><b>系统播报</b><span>澳门开奖数据同步中…</span></div><div class="chat-list" id="chatList"><div class="chat-empty">还没有人发言，来做第一个吧</div></div><div class="chat-identity"><span>我的昵称</span><input id="nickname" maxlength="12"></div><form class="chat-compose" id="chatForm"><input id="messageInput" maxlength="120" placeholder="仅限中文、数字和空格"><button id="sendButton" disabled>发送</button></form><div class="chat-quick"><button>期待开奖</button><button>祝大家好运</button><button>支持香港</button><button>支持澳门</button></div><p class="chat-notice" id="notice">禁止字母和符号 · 分开发送联系方式同样会被拦截</p></section></main><script>
(()=>{const api='/api/chat/v1',list=document.getElementById('chatList'),form=document.getElementById('chatForm'),nickname=document.getElementById('nickname'),input=document.getElementById('messageInput'),send=document.getElementById('sendButton'),online=document.getElementById('online'),notice=document.getElementById('notice');let messages=[];const device=localStorage.getItem('liuhe-chat-device')||crypto.randomUUID();localStorage.setItem('liuhe-chat-device',device);let name=(localStorage.getItem('liuhe-chat-name')||'').replace(/[^\u3400-\u9fff0-9]/gu,'').slice(0,12);if(name.length<2)name='来自中国的游客'+Math.floor(1000+Math.random()*9000);nickname.value=name;localStorage.setItem('liuhe-chat-name',name);
function render(){list.textContent='';if(!messages.length){const e=document.createElement('div');e.className='chat-empty';e.textContent='还没有人发言，来做第一个吧';list.append(e);return}for(const m of messages){const a=document.createElement('article');a.className=(m.deviceId===device?'mine ':'')+(m.isAdmin?'admin-message-item':'');const meta=document.createElement('div'),author=document.createElement('b'),time=document.createElement('time'),body=document.createElement('p');author.textContent=m.nickname||'';time.textContent=new Date(m.createdAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});body.textContent=m.content||'';meta.append(author);if(m.isAdmin){const badge=document.createElement('em');badge.className='admin-chat-badge';badge.textContent='官方管理员';meta.append(badge)}meta.append(time);a.append(meta,body);list.append(a)}list.scrollTop=list.scrollHeight}
async function poll(){try{const r=await fetch(api+'?device='+encodeURIComponent(device)+'&nickname='+encodeURIComponent(nickname.value),{cache:'no-store'}),data=await r.json();messages=data.messages||[];online.textContent=data.online||1;const m=nickname.value.match(/^(?:来自[\u3400-\u9fff]{1,6}的)?游客(\d{4})$/u);if(m&&data.viewerLocation){name=('来自'+data.viewerLocation+'的游客'+m[1]).slice(0,12);nickname.value=name;localStorage.setItem('liuhe-chat-name',name)}render()}catch{}finally{setTimeout(poll,2000)}}
nickname.onblur=()=>{const clean=nickname.value.replace(/[^\u3400-\u9fff0-9]/gu,'').slice(0,12);nickname.value=clean.length>=2?clean:(localStorage.getItem('liuhe-chat-name')||'游客8888');localStorage.setItem('liuhe-chat-name',nickname.value)};input.oninput=()=>send.disabled=!input.value.trim();document.querySelectorAll('.chat-quick button').forEach(b=>b.onclick=()=>{input.value=(input.value+b.textContent).slice(0,120);send.disabled=false;input.focus()});form.onsubmit=async e=>{e.preventDefault();const content=input.value.trim();if(!content||send.disabled)return;if(!/^[\u3400-\u9fff0-9\s]+$/u.test(content)){notice.textContent='只允许中文、数字和空格，不能发送字母或符号';return}send.disabled=true;send.textContent='…';try{const r=await fetch(api,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({deviceId:device,nickname:nickname.value,content})}),data=await r.json();notice.textContent=r.ok?'发送成功':(data.message||'发送失败');if(r.ok){input.value='';setTimeout(poll,120)}}catch{notice.textContent='发送失败'}finally{send.textContent='发送';send.disabled=!input.value.trim();setTimeout(()=>notice.textContent='禁止字母和符号 · 分开发送联系方式同样会被拦截',1200)}};poll()})();
</script>  <script src="/assets/cnzz-stat.js"></script>
</body></html>
