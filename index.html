<!DOCTYPE html><html lang="zh-CN"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />  <meta name="theme-color" content="#050505" />  <title>123六合网</title>  <style>    :root{      --bg:#050505;      --panel:#0b0c0d;      --panel2:#101214;      --line:#2a2d31;      --gold:#f5c84b;      --text:#f5f5f5;      --muted:#a9adb3;      --red:#ff2d2d;      --purple:#a855f7;      --orange:#ff7a00;      --green:#7bdc2b;      --blue:#2f8cff;      --cyan:#1fd4e5;      --yellow:#ffd400;      --radius:14px;    }















    *{box-sizing:border-box}    html{background:var(--bg)}    body{      margin:0;      background:        radial-gradient(circle at 50% -20%, rgba(245,200,75,.07), transparent 34%),        var(--bg);      color:var(--text);      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;      -webkit-font-smoothing:antialiased;    }















    .page{      width:min(100%, 760px);      margin:0 auto;      padding:14px 12px 36px;    }















    .topbar{      display:flex;      align-items:center;      justify-content:space-between;      gap:12px;      margin-bottom:12px;    }















    .brand h1{      margin:0;      font-size:clamp(28px,7vw,42px);      line-height:1.05;      font-weight:900;      letter-spacing:.5px;      text-shadow:0 2px 14px rgba(245,200,75,.14);    }















    .brand-name{      color:var(--gold);    }















    .brand-topic{      margin-left:5px;      color:#ff5b4d;      font-style:normal;      text-shadow:0 2px 14px rgba(255,74,61,.18);    }

    document.querySelectorAll('[data-history-list]').forEach(list => {      const section = list.closest('.section');      const buttons = section ? [...section.querySelectorAll('.record-history-btn')] : [];      if (!buttons.length) return;      const currentHtml = list.innerHTML;      const shift = Number(list.dataset.historyShift) || 0;      const zodiacOrder = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];      const zodiacTokens = zodiacOrder.map((_,index) => '__SX' + index + '__');      let olderHtml = currentHtml.replace(/(\d{3})期/g, (_, period) => String(Number(period) - shift).padStart(3, '0') + '期');      zodiacOrder.forEach((zodiac,index) => { olderHtml = olderHtml.replaceAll(zodiac,zodiacTokens[index]); });      zodiacTokens.forEach((token,index) => { olderHtml = olderHtml.replaceAll(token,zodiacOrder[(index + shift) % zodiacOrder.length]); });      olderHtml = olderHtml.replace(/(?<!\d)(\d{2})(?!\d)/g, (_, number) => {        const value = Number(number);        if (value < 1 || value > 49) return number;        return String(((value + shift * 3 - 1) % 49) + 1).padStart(2, '0');      }).replaceAll('待开奖','已开奖').replaceAll('开？','开');      buttons.forEach(button => {        button.addEventListener('click', () => {          buttons.forEach(item => item.classList.toggle('active', item === button));          list.innerHTML = button.dataset.view === 'older' ? olderHtml : currentHtml;        });      });    });















    const masterGrid = document.querySelector('.master-grid');    if (masterGrid) {      const prepareMasterCards = () => masterGrid.querySelectorAll('.master-card').forEach(card => { card.setAttribute('role','link'); card.setAttribute('tabindex','0'); });      const openMasterDetail = card => {        const cards = [...masterGrid.querySelectorAll('.master-card')];        const id = Number(card.dataset.masterId) || cards.indexOf(card) + 1;        const storedLotteryType = Number(localStorage.getItem('lotteryType'));        const lotteryType = [1,5,8].includes(storedLotteryType) ? storedLotteryType : 5;        location.href = 'master-detail.html?id=' + id + '&lotteryType=' + lotteryType;      };      prepareMasterCards();      new MutationObserver(prepareMasterCards).observe(masterGrid,{childList:true,subtree:true});      masterGrid.addEventListener('click', event => { const card=event.target.closest('.master-card'); if(card)openMasterDetail(card); });      masterGrid.addEventListener('keydown', event => { const card=event.target.closest('.master-card'); if(card&&(event.key==='Enter'||event.key===' ')){event.preventDefault();openMasterDetail(card);} });    }















  </script><script src="site-sync.js?v=65"></script>  <script src="/assets/cnzz-stat.js"></script></body></html>
