<script type="text/javascript">
var shuju = [];
var red = [];
var blue = [];
var green = [];

$.getJSON("/tmzs.json?v=20260818",function(response){
        if(response.status == 0){
            var str = '';
            var typenum = 0;
            $.each(response.data,function(k,v){
              
              str += `<div class="choose-box-item clear">`;
                $.each(v,function(k1,v1){
                  if(v1.huanhang == 2){
                    str +=  `</div>`;
                    str += `<div class="choose-box-item clear">`;
                  }
                  shuju[v1.name] = v1.numberList;
                  str += `<span class="" type="`+k+`" sort="`+k1+`">`+v1.name+`</span>`;
                })
              str +=  `</div>`;
              typenum++;
            })
            $('#list').html(str);
            red = response.data.color[0].numberList;
            blue = response.data.color[1].numberList;
            green = response.data.color[2].numberList;
            
        }
});

var xuanze = [];
var intersec = [];
var types = [];
var shama = [];
function yunsuan(){
  if(xuanze.length == 0){
      $('.result-content').html('');
      return false;
    }
    var bingji = [];
   $.each(xuanze, function(key, value) {
      var setarr = '';
      if(value.length > 1){
        $.each(value,function(k1,v1){
          if(k1==0){
            setarr = v1;
          }else{
            setarr += ','+v1;
          }
          
        })
        var union = new Set([setarr]);
        
        var a = Array.from(union)[0].split(',');
        a = Array.from(new Set(a));;
       
        bingji[key] = a;
      }else{
        bingji[key] = value[0];
      }
      

  });

   if(bingji.length > 1){
    for (var i = 0; i < bingji.length - 1; i++) {
      var a1 = bingji[i];
      var a2 = bingji[i + 1];
      intersec = a1.filter(val => a2.indexOf(val) > -1);
    }
      
   }else{
     intersec = bingji[0];
   }
   intersec = intersec.sort((a, b) => a - b);

  var str = '';
  $.each(intersec,function(k,v){
    if($.inArray(v, shama) == -1){
       if(red.includes(v)){
          var calss = 'red';
        }
        if(blue.includes(v)){
          var calss = 'blue';
        }
        if(green.includes(v)){
          var calss = 'green';
        }
        str += `<span class="`+calss+`">`+v+`</span>`;   
    }
    
  })
  $('.result-content').html(str);
}
$('body').on('click','.choose-box-item span',function(){
  var name = $(this).text();
  var number = shuju[name];
  var type = $(this).attr('type');
  var sort = $(this).attr('sort');

  if($(this).hasClass('active')){
    $(this).removeClass('active');
    var index = $.inArray(type, types);
    xuanze[index] = xuanze[index].filter(item => item !==number);
    if(xuanze[index].length==0){
      types = types.filter(item => item !==type);
      xuanze = xuanze.filter(function(item) {
          return item && item.length != 0;
      });
    }
  }else{
    $(this).addClass('active');
    var index = $.inArray(type, types);
    if(index == -1){
      types.push(type);
      var index = $.inArray(type, types);
      var aa = [];
      aa[0] = number;
      xuanze[index] = aa;
    }else{
      var index = $.inArray(type, types);
      xuanze[index].push(number);
    }
    
  }
 
  yunsuan();
  
})

$('#shama').click(function(){
  $('.shamabox').show();

})
$('#gb').click(function(){
  $('.shamabox').hide();
})

$('.sha-content span').click(function(){
  var num = $(this).text();
  if ($.isNumeric(num)) {//单个杀码
    if($(this).hasClass('active')){
      shama = shama.filter(item => item !== num);
      $(this).removeClass('active');
    }else{
      shama.push(num);
      $(this).addClass('active');
    }

  } else {//生肖杀码
    var number = shuju[num];
    if($(this).hasClass('active')){
      $.each(number,function(k,v){
        shama = shama.filter(item => item !== v);
      })
      $(this).removeClass('active');
    }else{
      $.each(number,function(k,v){
        shama.push(v);   
      })
      $(this).addClass('active');
    }
  }
  // 有杀码进行删除
  if(shama.length > 0){
    var s = '<div class="font-s">杀码:</div>';
    $.each(shama,function(k,v){
      if(red.includes(v)){
          var calss = 'red';
        }
        if(blue.includes(v)){
          var calss = 'blue';
        }
        if(green.includes(v)){
          var calss = 'green';
        }
      s += `<span class="`+calss+`">`+v+`</span>`;
    })
    $('.result-shama').html(s).show();
  }else{
    $('.result-shama').html('').hide();
  }
$('#list').css("margin-top","288px");
  

  // 删除杀码
  console.log(shama)
  if(intersec.length > 0){
      var str = '';
      $.each(intersec,function(k,v){
        if($.inArray(v, shama) == -1){
            if(red.includes(v)){
                var calss = 'red';
              }
              if(blue.includes(v)){
                var calss = 'blue';
              }
              if(green.includes(v)){
                var calss = 'green';
              }
              str += `<span class="`+calss+`">`+v+`</span>`;
          }
        
      })
      $('.result-content').html(str);
  }
})


$('#qingkong').click(function(){
  $('.result-content').html('');
  $('.result-shama').html('').hide();
  xuanze = [];
  intersec = [];
  types = [];
  shama = [];
  $('.choose-box-item span').removeClass('active');
  $('.sha-content span').removeClass('active')
})

function copy() {
    var aa = $('.result-content span');
    var b = [];
    $.each(aa,function(k,v){
      var c = $(v).text();
      b.push(c);
    })
    $('#output').val(b.join(','));
    const inputEle = document.querySelector("#output");
    inputEle.select(); // 鼠标选择的内容
    document.execCommand("copy"); // 复制
    layer.msg('复制成功');
}

$('#bcjsb').click(function(){
  var aa = $('.result-content span');
    var b = [];
    $.each(aa,function(k,v){
      var c = $(v).text();
      b.push(c);
    })
    var aaaa = `挑码结果:\n`+b.join(',')+` 共`+b.length+`码\n[`+getdate()+`]`;
    if(localStorage.getItem("jilu") == null){
      var jilu = aaaa;
    }else{
      var jilu = localStorage.getItem("jilu")+'\n'+aaaa;
    }
    
    localStorage.setItem("jilu", jilu);
    $('#cun').val(jilu);
    layer.msg('保存成功');
})

  localStorage.setItem("jilu", $('#cun').val());layer.msg('保存成功');

function getdate() {
  // 获取当前时间
  let currentTime = new Date();
  // 获取年份
  let year = currentTime.getFullYear();
  // 获取月份（注意月份是从0开始计数的，所以需要加1）
  let month = currentTime.getMonth() + 1;
  // 获取日期
  let day = currentTime.getDate();
  // 获取小时
  let hours = currentTime.getHours();
  // 获取分钟
  let minutes = currentTime.getMinutes();
  // 获取秒数
  let seconds = currentTime.getSeconds();
  return year+'-'+month+'-'+day+' '+hours+':'+minutes+':'+seconds;
}
