<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会员资料 - 123六合网</title><style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font-family:"Microsoft YaHei",Arial,sans-serif}.wrap{width:min(760px,100%);margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;padding:14px 12px;border-bottom:2px solid #c79b2d}.brand{color:#ffd65a;font-size:22px;font-weight:900}.back{color:#ddd;text-decoration:none}.card{margin-top:14px;border:1px solid #4e411f;border-radius:12px;background:#0c0d0e;overflow:hidden}.title{padding:17px 10px;text-align:center;color:#ff4e4e;font-size:21px;font-weight:900;border-bottom:1px solid #332a19}.rows{padding:5px 10px}.row{display:flex;align-items:center;justify-content:center;gap:8px;min-height:47px;border-bottom:1px solid #29251d;white-space:nowrap;font-size:16px;font-weight:800}.row:last-child{border:0}.period{color:#f6cb51}.author{color:#eee}.type{color:#a75bff}.data{color:#00d77c}.state{color:#ff4b4b}.current .data{color:#ff4b4b}.footer-html{padding:18px 12px;text-align:center;line-height:1.9;color:#f6cb51;border-top:1px solid #332a19}.footer-html a{color:#ff4b4b;text-decoration:none;font-weight:900}.banner{display:block;width:100%;margin-top:14px;border:1px solid #4e411f;border-radius:10px;overflow:hidden;background:#0b0b0b}.banner img{display:block;width:100%;height:auto;object-fit:contain}.note{text-align:center;color:#888;font-size:12px;padding:14px}@media(max-width:520px){.wrap{padding:7px}.brand{font-size:18px}.title{font-size:17px;padding:14px 6px}.rows{padding:3px 5px}.row{gap:4px;min-height:42px;font-size:13px;letter-spacing:-.2px}.footer-html{font-size:14px;padding:14px 7px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">123六合网</div><a class="back" href="/">返回首页</a></header><section class="card"><div class="title" id="title">资料加载中…</div><div class="rows" id="rows"></div><div class="footer-html" id="footer"></div></section><a class="banner" id="banner" hidden target="_blank" rel="noopener"><img id="bannerImage" alt="广告"></a><div class="note">资料仅供娱乐参考，请以实际开奖结果为准。</div></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=Number(new URLSearchParams(location.search).get('id')||0),zodiacs='鼠牛虎兔龙蛇马羊猴鸡狗猪'.split('');
function allObjects(root){const out=[];(function walk(v){if(!v||typeof v!=='object')return;if(!Array.isArray(v)){const p=Number(v.period||v.issue||v.issueNo||v.intPeriod||0);if(p)out.push(v)}Object.values(v).forEach(walk)})(root);return out}
function drawOf(v){const period=Number(v.period||v.issue||v.issueNo||v.intPeriod||0);let nums=[],zs=[];(function walk(x){if(x==null)return;if(typeof x==='number'&&x>=1&&x<=49)nums.push(x);else if(typeof x==='string'){for(const m of x.matchAll(/(?:^|\D)(0?[1-9]|[1-4]\d)(?=\D|$)/g))nums.push(Number(m[1]));for(const m of x.matchAll(/[鼠牛虎兔龙蛇马羊猴鸡狗猪]/g))zs.push(m[0])}else if(typeof x==='object')Object.values(x).forEach(walk)})(v);nums=[...new Set(nums)].slice(-7);zs=[...new Set(zs)];return{period,nums,zs}}
function chosen(draw,type,seed){const isZ=/肖/.test(type),match=type.match(/[一二两三四五六七八九十]/),map={一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10},count=Math.max(1,map[match?.[0]]||1),pool=isZ?(draw.zs.length?draw.zs:zodiacs):draw.nums;if(!pool.length)return'开奖记录';const values=[],needsSpecial=!isZ&&/中\s*特|码中特/.test(type),special=needsSpecial?pool[pool.length-1]:null,candidates=needsSpecial?pool.slice(0,-1):pool,start=Math.abs(seed)%Math.max(1,candidates.length);for(let i=0;i<Math.min(count-(needsSpecial?1:0),candidates.length);i++)values.push(candidates[(start+i)%candidates.length]);if(needsSpecial&&special!=null)values.push(special);const shown=isZ?values:values.sort((a,b)=>Number(a)-Number(b));return shown.map(v=>typeof v==='number'?String(v).padStart(2,'0'):v).join(isZ?'':'、')}
async function histories(type,count,lotteryType){const result=[],seen=new Set(),year=new Date().getFullYear();for(let page=1;page<=4&&result.length<count;page++){const r=await fetch('/api/public/lottery-history?lotteryType='+lotteryType+'&year='+year+'&pageNum='+page,{cache:'no-store'}),p=await r.json();for(const item of allObjects(p)){const d=drawOf(item);if(d.period&&!seen.has(d.period)&&(d.nums.length||d.zs.length)){seen.add(d.period);result.push(d)}}}return result.sort((a,b)=>a.period-b.period).slice(-count)}
async function load(){if(!id)throw Error('缺少资料编号');const response=await fetch('/api/public/member-posts?id='+id,{cache:'no-store'}),payload=await response.json(),post=payload.data?.[0];if(!post)throw Error('资料不存在或已隐藏');const latestPayload=await fetch('/api/public/lottery-latest?lotteryType='+post.lottery_type,{cache:'no-store'}).then(r=>r.json()).catch(()=>({})),latestObjects=allObjects(latestPayload),latest=Math.max(0,...latestObjects.map(v=>Number(v.period||v.issue||v.issueNo||v.intPeriod||0))),next=latest?latest+1:'最新';document.title=next+'期 '+post.author+' '+post.post_type+' - 123六合网';$('title').textContent=next+'期：《'+post.author+'》'+post.post_type;const history=await histories(post.post_type,Math.max(1,Math.min(100,Number(post.history_count)||20)),post.lottery_type);$('rows').innerHTML=history.map((d,i)=>'<div class="row"><span class="period">'+d.period+'期：</span><span class="author">《'+esc(post.author)+'》</span><span class="type">'+esc(post.post_type)+'</span><span class="data">【'+esc(chosen(d,post.post_type,id+d.period+i))+'】</span><span class="state">准</span></div>').join('')+'<div class="row current"><span class="period">'+next+'期：</span><span class="author">《'+esc(post.author)+'》</span><span class="type">'+esc(post.post_type)+'</span><span class="data">【'+esc(post.current_data||'注册提前看料')+'】</span></div>';$('footer').innerHTML=post.footer_html||'<b>注册后查看当期资料</b>';const ads=await fetch('/api/public/ads',{cache:'no-store'}).then(r=>r.json()).catch(()=>({data:[]})),ad=(ads.data||[]).find(x=>x.position_key==='master-detail-bottom')||(ads.data||[]).find(x=>x.position_key==='detail');if(ad?.image_url){$('bannerImage').src=ad.image_url;$('banner').href=ad.link_url||'#';$('banner').hidden=false}}
load().catch(e=>{$('title').textContent=e.message;$('rows').innerHTML='<div class="row">请返回首页重试</div>'});
</script></body></html>
