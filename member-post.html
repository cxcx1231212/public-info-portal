</style><style id="skyMemberTheme">body{background:radial-gradient(circle at 50% -20%,rgba(24,144,255,.13),transparent 36%),#f6fafe;color:#1f3b57}.top{border-color:#1890ff;background:#fff}.brand,.back{color:#0b5cad}.card{border-color:#cfe8ff;background:#fff;box-shadow:0 4px 14px rgba(35,122,190,.08)}.title{border-color:#e2f1ff;color:#0b5cad}.row{border-color:#e2f1ff}.period{color:#0b5cad}.author,.type,.data{color:#1f3b57}.state,.current .data{color:#e04444}.footer-html{border-color:#e2f1ff;color:#0b5cad}.footer-html a{color:#0b5cad}.banner{border-color:#cfe8ff;background:#fff}.note{color:#6b7f93}</style></head><body><main class="wrap"><header class="top"><div class="brand">123六合网</div><a class="back" id="backToHome" href="/#masters">返回高手榜</a></header><section class="card"><div class="title" id="title">资料加载中…</div><div class="rows" id="rows"></div><div class="footer-html" id="footer"></div></section><a class="banner" id="banner" hidden target="_blank" rel="noopener"><img id="bannerImage" alt="广告"></a><div class="note">资料仅供娱乐参考，请以实际开奖结果为准。</div></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const requestedLotteryType=Number(new URLSearchParams(location.search).get('lotteryType')),id=Number(new URLSearchParams(location.search).get('id')||0),zodiacs='鼠牛虎兔龙蛇马羊猴鸡狗猪'.split('');
function allObjects(root){const out=[];(function walk(v){if(!v||typeof v!=='object')return;if(!Array.isArray(v)){const p=Number(v.period||v.issue||v.issueNo||v.intPeriod||0);if(p)out.push(v)}Object.values(v).forEach(walk)})(root);return out}
function numberOf(v){if(typeof v==='number')return v;if(typeof v==='string'&&/^0?[1-9]$|^[1-4]\d$/.test(v.trim()))return Number(v);if(v&&typeof v==='object')for(const key of ['number','num','code','ball','value']){const n=Number(v[key]);if(n>=1&&n<=49)return n}return 0}
function zodiacOf(v){if(v&&typeof v==='object')for(const key of ['shengXiao','shengxiao','zodiac','animal']){const z=String(v[key]||'').match(/[鼠牛虎兔龙蛇马羊猴鸡狗猪]/)?.[0];if(z)return z}return String(v??'').match(/[鼠牛虎兔龙蛇马羊猴鸡狗猪]/)?.[0]||''}
function drawOf(v){const period=Number(v.period||v.issue||v.issueNo||v.intPeriod||0);const candidates=[];(function walk(x,key=''){if(!x||typeof x!=='object')return;if(Array.isArray(x)){const nums=x.map(numberOf).filter(n=>n>=1&&n<=49);if(nums.length>=7)candidates.push({nums:nums.slice(0,7),zs:x.slice(0,7).map(zodiacOf),score:(/number|ball|code|open|lottery|result|开奖|号码/i.test(key)?20:0)+(nums.length===7?10:0)});x.forEach(item=>walk(item,key));return}for(const [name,item]of Object.entries(x))walk(item,name)})(v);const best=candidates.sort((a,b)=>b.score-a.score)[0];if(best)return{period,nums:best.nums,zs:best.zs};for(const key of ['numberList','numbers','openCode','openNumbers','lotteryNumbers','result']){const raw=v[key];if(raw==null)continue;const nums=String(raw).match(/(?:^|\D)(0?[1-9]|[1-4]\d)(?=\D|$)/g)?.map(s=>Number(s.replace(/\D/g,''))).slice(0,7)||[];if(nums.length===7)return{period,nums,zs:[]}}return{period,nums:[],zs:[]}}
function mixed(pool,seed){return pool.map((value,index)=>({value,key:Math.sin((Math.abs(seed)+index+1)*12.9898)*43758.5453%1})).sort((a,b)=>a.key-b.key).map(item=>item.value)}
function chosen(draw,type,seed,mode='regular'){const label=String(type||'').replace(/[【】\s]/g,''),map={一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10},match=label.match(/[一二两三四五六七八九十]|\d+/),count=Math.max(1,Number(match?.[0])||map[match?.[0]]||1),regular=draw.nums.slice(0,6),special=draw.nums[6],isZ=/肖/.test(label),takeSpecial=mode==='special';let values=[];if(takeSpecial){if(special==null)return'开奖记录';if(isZ){const specialZ=draw.zs[6]||(['马','蛇','龙','兔','虎','牛','鼠','猪','狗','鸡','猴','羊'][(Number(special)-1)%12]),others=mixed(zodiacs.filter(z=>z!==specialZ),seed);values=[specialZ,...others.slice(0,Math.min(count-1,others.length))]}else{const others=mixed(Array.from({length:49},(_,i)=>i+1).filter(n=>n!==special),seed);values=[special,...others.slice(0,Math.min(count-1,others.length))]}}else{const pool=isZ?draw.zs.slice(0,6).filter(Boolean):regular;if(!pool.length)return'开奖记录';values=mixed([...new Set(pool)],seed).slice(0,Math.min(count,pool.length))}const shown=isZ?values:values.sort((a,b)=>Number(a)-Number(b));return shown.map(v=>typeof v==='number'?String(v).padStart(2,'0'):v).join(isZ?'':'、')}
async function histories(type,count,lotteryType){const result=[],seen=new Set(),year=new Date().getFullYear();for(let page=1;page<=4&&result.length<count;page++){const r=await fetch('/api/public/lottery-history?lotteryType='+lotteryType+'&year='+year+'&pageNum='+page,{cache:'no-store'}),p=await r.json();for(const item of allObjects(p)){const d=drawOf(item);if(d.period&&!seen.has(d.period)&&(d.nums.length||d.zs.length)){seen.add(d.period);result.push(d)}}}return result.sort((a,b)=>a.period-b.period).slice(-count)}
async function load(){if(!id)throw Error('缺少资料编号');const response=await fetch('/api/public/member-posts?id='+id,{cache:'no-store'}),payload=await response.json(),post=payload.data?.[0];if(!post)throw Error('资料不存在或已隐藏');const returnLotteryType=[1,5,8].includes(requestedLotteryType)?requestedLotteryType:Number(post.lottery_type)||5;$('backToHome').href='/?lotteryType='+returnLotteryType+'#masters';const latestPayload=await fetch('/api/public/lottery-latest?lotteryType='+post.lottery_type,{cache:'no-store'}).then(r=>r.json()).catch(()=>({})),latestObjects=allObjects(latestPayload),latest=Math.max(0,...latestObjects.map(v=>Number(v.period||v.issue||v.issueNo||v.intPeriod||0))),next=latest?latest+1:'最新';document.title=next+'期 '+post.author+' '+post.post_type+' - 123六合网';$('title').textContent=next+'期：《'+post.author+'》'+post.post_type;const history=await histories(post.post_type,Math.max(1,Math.min(100,Number(post.history_count)||20)),post.lottery_type);$('rows').innerHTML=history.map((d,i)=>'<div class="row"><span class="period">'+d.period+'期：</span><span class="author">《'+esc(post.author)+'》</span><span class="type">'+esc(post.post_type)+'</span><span class="data">【'+esc(chosen(d,post.post_type,id+d.period+i,post.extract_mode||'regular'))+'】</span><span class="state">准</span></div>').join('')+'<div class="row current"><span class="period">'+next+'期：</span><span class="author">《'+esc(post.author)+'》</span><span class="type">'+esc(post.post_type)+'</span><span class="data">【'+esc(post.current_data||'注册提前看料')+'】</span></div>';$('footer').innerHTML=post.global_footer_html||post.footer_html||'<b>注册后查看当期资料</b>';const ads=await fetch('/api/public/ads',{cache:'no-store'}).then(r=>r.json()).catch(()=>({data:[]})),ad=(ads.data||[]).find(x=>x.position_key==='master-detail-bottom')||(ads.data||[]).find(x=>x.position_key==='detail');if(ad?.image_url){$('bannerImage').src=ad.image_url;$('banner').href=ad.link_url||'#';$('banner').hidden=false}}
load().catch(e=>{$('title').textContent=e.message;$('rows').innerHTML='<div class="row">请返回首页重试</div>'});
